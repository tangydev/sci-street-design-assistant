<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Street Design Assistant: result viewer prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces + ink */
  --bg:#f5f3ee; --panel:#ffffff; --sunk:#faf8f4; --line:#e3ded4; --line-strong:#cdc6b8;
  --text:#1c2327; --muted:#5f686d; --faint:#8a9296;
  --accent:#1d5b86; --accent-soft:#e7f0f7;
  /* check states */
  --met:#1d7a48; --met-bg:#e7f3ec;
  --notmet:#b3261e; --notmet-bg:#fbeceb;
  --indet:#9a5a00; --indet-bg:#fdf1de;
  --na:#53657c; --na-bg:#edf1f5;
  /* street elements */
  --bike:#3478a6; --buffer:#e5bf55; --travel:#424a53; --turn:#5c6673; --parking:#a7b0ba; --other:#c4c9cd;
  --curb:#bfb8aa;
  --serif:"Roboto Slab",Georgia,serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.005em}
h1{font-size:19px}
h2{font-size:16px;margin-bottom:10px}
h3{font-size:14px}
button{font:inherit;color:inherit}
.muted{color:var(--muted)} .small{font-size:12.5px} .faint{color:var(--faint)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* ---------- app bar ---------- */
.appbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand .sub{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tab{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;display:flex;gap:9px;align-items:center;font-weight:600;font-size:14px;color:var(--muted);transition:background .15s,color .15s}
.tab .n{font-family:var(--serif);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1.5px solid currentColor}
.tab:hover{color:var(--text);background:#fff}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(29,91,134,.35)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker{display:flex;flex-direction:column;gap:2px;min-width:250px}
.picker label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
select{background:#fff;color:var(--text);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.wrap{max-width:1320px;margin:0 auto;padding:20px}
.design-intro{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.design-intro h2{font-size:22px;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(40,30,10,.04)}
.empty{color:var(--faint);text-align:center;padding:36px 10px;font-size:13.5px}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.ph{border:1px dashed var(--line-strong);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--muted);background:var(--sunk)}

/* ---------- status ---------- */
.status{border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:center;min-height:84px;border:1.5px solid var(--line);background:var(--panel)}
.status .icon{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;background:var(--faint)}
.status .word{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.15}
.status .reason{font-size:13.5px;color:var(--muted)}
.status.feasible{border-color:var(--met);background:var(--met-bg)} .status.feasible .icon{background:var(--met)} .status.feasible .word{color:var(--met)}
.status.infeasible,.status.error{border-color:var(--notmet);background:var(--notmet-bg)} .status.infeasible .icon,.status.error .icon{background:var(--notmet)} .status.infeasible .word,.status.error .word{color:var(--notmet)}
.status.unresolved{border-color:var(--indet);background:var(--indet-bg)} .status.unresolved .icon{background:var(--indet)} .status.unresolved .word{color:var(--indet)}
.status.idle .word,.status.loading .word{font-size:18px;color:var(--muted)}
.status.idle .icon{background:var(--line);color:var(--muted)}
.status.loading .icon{background:transparent;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- request ---------- */
.req q{display:block;font-family:var(--serif);font-size:16px;line-height:1.4;margin-top:4px;quotes:"“" "”"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}

/* ---------- pills + checks ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.met{color:var(--met);background:var(--met-bg)} .pill.notmet{color:var(--notmet);background:var(--notmet-bg)}
.pill.indet{color:var(--indet);background:var(--indet-bg)} .pill.na{color:var(--na);background:var(--na-bg)} .pill.muted{background:var(--sunk)}
.c-met{color:var(--met)} .c-notmet{color:var(--notmet)} .c-indet{color:var(--indet)} .c-na{color:var(--na)} .c-muted{color:var(--faint)}
.check{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.check:last-child{border-bottom:none}
.check.wide{grid-template-columns:130px 1fr 260px;align-items:center}
.check .rule{font-weight:600}
.gauge-na{font-size:12px;color:var(--faint);text-align:center;border:1px dashed var(--line-strong);border-radius:8px;padding:8px}

/* ---------- cross-section ---------- */
.rowlabel{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;font-size:13.5px}
.rowlabel:first-child{margin-top:0}
.strips{display:flex;border-radius:10px;overflow:hidden;min-height:60px;border:1px solid var(--line)}
.strip{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:12px;line-height:1.3;padding:5px 3px;border-right:2px solid #fff;min-width:0;overflow:hidden}
.strip:last-child{border-right:none}
.strip b{font-weight:700}
.derived{background-image:repeating-linear-gradient(45deg,transparent 0 7px,rgba(255,255,255,.22) 7px 9px)}
.chg{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.9);color:var(--text)}
.topdown{display:flex;height:120px;border-left:4px solid var(--curb);border-right:4px solid var(--curb);margin-top:6px;border-radius:2px;overflow:hidden}
.lane{position:relative}
.lane.buffer-l{background-image:repeating-linear-gradient(-45deg,#fff 0 3px,transparent 3px 11px)}
.lane+.lane.car{box-shadow:inset 2px 0 0 0 rgba(255,255,255,.0)}
.lane.car+.lane.car::before{content:"";position:absolute;left:-1px;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.75)}
.curbnote{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.toggle{font-size:13px;display:inline-flex;gap:7px;align-items:center;cursor:pointer;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:15px;height:15px}

/* ================= DESIGN 1: interactive ================= */
.d1-top{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.3fr);gap:14px;margin-bottom:14px}
.d1-main{display:grid;grid-template-columns:270px minmax(0,1fr) 350px;gap:14px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:block;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:var(--line-strong)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.opt .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--met);border-radius:5px;padding:1px 7px}
.diff{font-size:12.5px;margin:7px 0;padding:0;list-style:none}
.diff .add{color:var(--met)} .diff .rem{color:var(--notmet)}
.crit{font-size:12px;color:var(--muted)}
.phgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}

/* ================= DESIGN 2: report ================= */
.report{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.rep-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.rep-head .where{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2}
.btn{cursor:pointer;border:1px solid var(--line-strong);background:#fff;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600}
.btn:hover{background:var(--sunk)}
.sec-title{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sec-title h2{margin:0}
.count{font-family:var(--serif);font-weight:700;color:#fff;background:var(--accent);border-radius:7px;padding:0 8px;font-size:14px}
.reasons{list-style:none;margin:6px 0 0;padding:0}
.reasons li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.reasons li:last-child{border-bottom:none}
.reasons .x{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
details.fold{border:1px solid var(--line);border-radius:14px;background:#fff}
details.fold>summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:600;display:flex;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"›";font-size:20px;line-height:1;color:var(--muted);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
details.fold .body{padding:0 16px 14px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}

/* ================= DESIGN 3: street first ================= */
.d3-top{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,1.2fr);gap:14px;margin-bottom:14px}
.opttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.otab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700;font-size:14px}
.otab:hover{border-color:var(--line-strong)}
.otab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.otab.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.otab .tag{font-size:9.5px}
.critline{font-size:13px;color:var(--muted);margin:4px 0 14px}
.critline b{color:var(--text)}
.d3-main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.road{display:grid;grid-template-columns:140px minmax(0,1fr);column-gap:12px;margin-top:6px}
.road-labels{display:flex;flex-direction:column;padding:4px 0}
.road-labels div{display:flex;flex-direction:column;justify-content:center;font-size:12.5px;line-height:1.25;border-bottom:1px solid transparent}
.road-labels b{font-weight:700}
.road-body{position:relative;padding:44px 0 0}
.road-asph{border-top:4px solid var(--curb);border-bottom:4px solid var(--curb);display:flex;flex-direction:column}
.band{position:relative;overflow:hidden}
.band.car+.band.car::before{content:"";position:absolute;left:0;right:0;top:-1px;border-top:2px dashed rgba(255,255,255,.75)}
.band.buffer-b{background-image:repeating-linear-gradient(-45deg,#fff 0 3px,transparent 3px 12px)}
.band .arrows{position:absolute;inset:0;display:flex;justify-content:space-around;align-items:center;color:rgba(255,255,255,.45);font-size:18px;pointer-events:none}
.flag{all:unset;cursor:pointer;position:absolute;top:0;bottom:0;width:0;transform:translateX(-1px)}
.flag .pole{position:absolute;top:30px;bottom:0;left:0;border-left:2px solid currentColor;opacity:.8}
.flag .head{position:absolute;top:0;left:-15px;width:30px;height:30px;border-radius:8px 8px 8px 2px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;background:currentColor;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.flag .head span{color:#fff}
.flag:hover .head{transform:translateY(-2px)}
.flag.sel .head{outline:3px solid var(--text);outline-offset:2px}
.flag:focus-visible .head{outline:3px solid var(--accent);outline-offset:2px}
.road-axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.road-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--muted)}
.station-panel{position:sticky;top:96px}
.sp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.xbtn{all:unset;cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:18px}
.xbtn:hover{background:var(--sunk);color:var(--text)}
.xbtn:focus-visible{outline:2px solid var(--accent)}
.mini{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line);margin-bottom:4px}
.mini div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;padding:7px 2px;border-right:2px solid #fff;min-width:0}
.mini div:last-child{border-right:none}
.station-panel .check{grid-template-columns:118px 1fr}

@media (max-width:1100px){
  .d1-main{grid-template-columns:1fr 1fr}.d1-main>:first-child{grid-column:1/-1}
  .d3-main{grid-template-columns:1fr}.station-panel{position:static}
}
@media (max-width:760px){
  .d1-top,.d1-main,.d3-top{grid-template-columns:1fr}
  .check.wide{grid-template-columns:120px 1fr}.check.wide>:last-child{grid-column:1/-1}
  .road{grid-template-columns:96px minmax(0,1fr)}
  .kv{grid-template-columns:1fr}
}
@media print{
  .appbar,.no-print{display:none!important}
  body{background:#fff}
  details.fold{break-inside:avoid}
}
</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-in">
    <div class="brand">
      <h1>Street Design Assistant</h1>
      <span class="sub">Result viewer: three prototype designs. All demo values are made up.</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Design">
      <button class="tab" role="tab" data-design="1"><span class="n">1</span>Interactive</button>
      <button class="tab" role="tab" data-design="2"><span class="n">2</span>Report</button>
      <button class="tab" role="tab" data-design="3"><span class="n">3</span>Street first</button>
    </nav>
    <div class="picker">
      <label for="file">Design record</label>
      <select id="file"></select>
    </div>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ======================================================================
   Shared data + helpers. The page computes nothing new: every number on
   screen comes from the record (converted from metres to feet).
   ====================================================================== */
const DEMOS = [
  {file:"records/example1.json", label:"10th St, block 2 (feasible demo)"},
  {file:"records/example2.json", label:"10th St, block 3 (infeasible demo)"},
  {file:"records/example3.json", label:"10th St, block 4 (unresolved demo)"},
  {file:"records/missing-file.json", label:"Broken file (error demo)"}
];
const DESIGNS = {
  1:{name:"Interactive", blurb:"Everything on one screen: pick an option, compare it with today, read its checks."},
  2:{name:"Report", blurb:"A single page you read top to bottom: the answer first, then why, then the details."},
  3:{name:"Street first", blurb:"The street is the main view. Flags mark each station; click one to see what was checked there."}
};
const FT = 3.28084;
const ft = (m, d=1) => (m*FT).toFixed(d);
const CAR = new Set(["travel_lane","turn_lane"]);
const TYPES = {
  bike_lane:{label:"Bike lane", color:"var(--bike)", ink:"#fff"},
  buffer:{label:"Buffer", color:"var(--buffer)", ink:"#3b2e05"},
  travel_lane:{label:"Travel lane", color:"var(--travel)", ink:"#fff"},
  turn_lane:{label:"Turn lane", color:"var(--turn)", ink:"#fff"},
  parking_lane:{label:"Parking", color:"var(--parking)", ink:"#1c2327"},
  cycle_track:{label:"Cycle track", color:"var(--bike)", ink:"#fff"},
  median:{label:"Median", color:"var(--other)", ink:"#1c2327"},
  shoulder:{label:"Shoulder", color:"var(--other)", ink:"#1c2327"},
  gutter:{label:"Gutter", color:"var(--other)", ink:"#1c2327"}
};
const typeInfo = t => TYPES[t] || {label:t, color:"var(--other)", ink:"#1c2327"};
const STATE = {
  met:{icon:"✓", word:"Met", tok:"met"},
  not_met:{icon:"✕", word:"Not met", tok:"notmet"},
  indeterminate:{icon:"?", word:"Indeterminate", tok:"indet"},
  not_assessed:{icon:"⊘", word:"Not assessed", tok:"na"},
  no_data:{icon:"–", word:"No data", tok:"muted"}
};
const stateOf = s => STATE[s] || STATE.no_data;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const plural = (n, one, many) => `${n} ${n===1?one:many}`;

const S = {design:1, demo:"", phase:"idle", err:"", rec:null, sel:null, showBefore:true, station:null};

/* Display-only summary of an option, using the Section 1 rule:
   any check not met -> not met; else any indeterminate -> indeterminate; else met. */
function optionStatus(o){
  const c = o.checks || [];
  if (!c.length) return "no_data";
  if (c.some(x => x.outcome === "not_met")) return "not_met";
  if (c.some(x => x.outcome === "indeterminate")) return "indeterminate";
  return "met";
}
function derivedRange(o, type, station){
  const c = (o.checks||[]).filter(x => x.element === type && x.p05_m != null && (station == null || x.station_m === station));
  if (!c.length) return null;
  return {lo:Math.min(...c.map(x=>x.p05_m)), hi:Math.max(...c.map(x=>x.p95_m)), mid:c[0].median_m};
}
function elWidth(o, e, station){
  if (!e.derived) return e.width_m == null ? null : {lo:e.width_m, hi:e.width_m, mid:e.width_m};
  return o ? (derivedRange(o, e.type, station) || derivedRange(o, e.type)) : null;
}
const fmtW = w => !w ? "width unknown" : (Math.abs(w.lo-w.hi) < 1e-9 ? `${ft(w.mid)} ft` : `${ft(w.lo)}–${ft(w.hi)} ft`);
const current = () => S.rec && S.rec.options.find(o => o.id === S.sel);

/* The option the explanation centres on: the recommended one, else the one closest to passing. */
function focusOption(R){
  if (R.recommended_id) { const o = R.options.find(x => x.id === R.recommended_id); if (o) return o; }
  const ind = R.options.find(o => optionStatus(o) === "indeterminate");
  if (ind) return ind;
  return R.options.slice().sort((a,b) => (b.criteria?.lowest_p ?? 0) - (a.criteria?.lowest_p ?? 0))[0];
}
function summary(R){
  const st = R.options.map(optionStatus), n = st.length;
  const pass = st.filter(s => s==="met").length, ind = st.filter(s => s==="indeterminate").length;
  if (R.outcome === "feasible") return {kind:"feasible", icon:"✓", word:"Feasible", reason:`${pass} of ${n} options pass every check`};
  if (R.outcome === "infeasible") return {kind:"infeasible", icon:"✕", word:"Infeasible", reason:`0 of ${n} options pass every check`};
  if (R.outcome === "unresolved") return {kind:"unresolved", icon:"?", word:"Unresolved", reason:`0 of ${n} pass; ${ind} need${ind===1?"s":""} a field measurement`};
  return {kind:"error", icon:"✕", word:"Error", reason:`Unknown outcome "${R.outcome}" in this file`};
}
function failReason(o){
  const s = optionStatus(o);
  if (s === "no_data") return "No checks in this file";
  if (s === "met") return "Passes every check (ranked lower)";
  const c = o.checks.find(x => x.outcome === s);
  const lab = typeInfo(c.element).label, thr = (c.threshold_m*FT).toFixed(0);
  return s === "not_met" ? `${lab} under ${thr} ft (${c.rule_id})` : `${lab} too close to call (${c.rule_id}): needs a field measurement`;
}

function changeTags(o){

function chartHTML(o, mark){
  const d = o.elements.find(e => e.derived);
  const pts = (o.checks||[]).filter(c => d && c.element === d.type && c.p05_m != null);
  if (!pts.length) return {title:"Width along the street", html:`<div class="empty">No data.</div>`};
  const rule = pts[0].rule_id, series = pts.filter(c => c.rule_id === rule).sort((a,b)=>a.station_m-b.station_m);
  const thr = series[0].threshold_m*FT;
  const vals = series.flatMap(c => [c.p05_m*FT, c.p95_m*FT]).concat([thr]);
  const ymin = Math.floor((Math.min(...vals)-0.3)*2)/2, ymax = Math.ceil((Math.max(...vals)+0.3)*2)/2;
  const W=320, H=184, L=40, R=22, T=14, B=40;
  const s0 = series[0].station_m, s1 = series[series.length-1].station_m;
  const X = s => series.length===1 ? (L+W-R)/2 : L + (s-s0)/(s1-s0)*(W-L-R);
  const Y = v => T + (ymax-v)/(ymax-ymin)*(H-T-B);
  const single = series.length === 1, xs = single ? [X(s0)-60, X(s0)+60] : null;
  const px = (c,i) => single ? xs[i] : X(c.station_m);
  const ps = single ? [series[0], series[0]] : series;
  const col = "var(--bike)";
  let g = "";
  for (let v=ymin; v<=ymax+1e-9; v+=0.5) g += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-7}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${v.toFixed(1)}</text>`;
  const top = ps.map((c,i)=>`${px(c,i)},${Y(c.p95_m*FT)}`), bot = ps.map((c,i)=>`${px(c,i)},${Y(c.p05_m*FT)}`).reverse();
  g += `<polygon points="${top.concat(bot).join(" ")}" fill="${col}" opacity="0.2"/>`;
  g += `<polyline points="${ps.map((c,i)=>`${px(c,i)},${Y(c.median_m*FT)}`).join(" ")}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>`;
  series.forEach(c => { const tok = stateOf(c.outcome).tok; g += `<circle cx="${X(c.station_m)}" cy="${Y(c.median_m*FT)}" r="4.5" fill="var(--${tok})" stroke="#fff" stroke-width="1.5"/>`; });
  g += `<line x1="${L}" x2="${W-R}" y1="${Y(thr)}" y2="${Y(thr)}" stroke="var(--notmet)" stroke-dasharray="6 4" stroke-width="1.5"/>`;
  g += `<text x="${W-R}" y="${Y(thr)+14}" text-anchor="end" font-size="10.5" font-weight="600" fill="var(--notmet)">${esc(rule)} minimum ${thr.toFixed(1)} ft</text>`;
  if (mark != null && series.some(c => c.station_m === mark)) g += `<line x1="${X(mark)}" x2="${X(mark)}" y1="${T}" y2="${H-B}" stroke="var(--text)" stroke-width="1.5" opacity=".55"/>`;
  g += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line-strong)"/>`;
  series.forEach(c => g += `<text x="${X(c.station_m)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${ft(c.station_m,0)} ft</text>`);
  g += `<text x="${(L+W-R)/2}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--muted)">position along the street (station)</text><text x="6" y="${T-3}" font-size="10" fill="var(--muted)">ft</text>`;
  return {title:`${typeInfo(d.type).label} width along the street`,
    html:`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Width band per station against the ${esc(rule)} minimum">${g}</svg>
    <div class="legend">Shaded band = plausible width (p05–p95). Line = median. Dashed = rule minimum.</div>`};
}

  h += `<div class="opttabs" role="tablist" aria-label="Options">${R.options.map(x => { const st = stateOf(optionStatus(x));
    return `<button class="otab ${x.id===S.sel?"sel":""}" role="tab" aria-selected="${x.id===S.sel}" data-act="opt" data-id="${esc(x.id)}" data-key="opt-${esc(x.id)}">
      <span class="c-${st.tok}" aria-label="${st.word}">${st.icon}</span>Option ${esc(x.id)}${x.id===R.recommended_id ? ` <span class="tag">Recommended</span>` : ""}</button>`; }).join("")}</div>
    <div class="critline">Parking spaces removed: <b>${c.pk}</b> · Lowest P: <b>${c.p}</b> · Markings changed: <b>${c.mk}</b></div>
    <div class="d3-main">
      <section class="panel" aria-label="Road viewer">
        <h2>Road viewer <span class="small muted" style="font-family:var(--sans);font-weight:500">top-down, travelling left to right</span></h2>
        ${roadHTML(o.elements, o, true)}
        <div class="road-foot">
          <span>Flags show each station's result. Click one to open its details.</span>
          <label class="toggle"><input type="checkbox" data-act="before" ${S.showBefore?"checked":""}> Show before</label>
        </div>
        ${S.showBefore ? `<div class="rowlabel" style="margin-top:18px"><b>Before (today)</b></div>${(R.existing_elements||[]).length ? roadHTML(R.existing_elements, null, false) : `<div class="ph">Existing street: no data in this file</div>`}` : ""}
        ${curbHTML()}
      </section>
      ${stationPanel(o)}
    </div>`;
  return h;
}

/* ======================================================================
   App shell: rendering, events, loading
   ====================================================================== */
function render(){
  const key = document.activeElement?.dataset?.key;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(+t.dataset.design === S.design)));
  const d = DESIGNS[S.design];
  const intro = `<div class="design-intro no-print"><h2>Design ${S.design}: ${d.name}</h2><span class="muted small">${d.blurb}</span></div>`;
  $("app").innerHTML = intro + (S.design === 1 ? design1() : S.design === 2 ? design2() : design3());
  if (key) document.querySelector(`[data-key="${key}"]`)?.focus();
}
function setDesign(n){ S.design = n; history.replaceState(null, "", `#design-${n}`); render(); }

document.querySelectorAll(".tab").forEach(t => t.onclick = () => setDesign(+t.dataset.design));
$("app").addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "opt"){ S.sel = t.dataset.id; S.station = worstStation(current()); render(); }
  else if (a === "station"){ S.station = +t.dataset.st; render(); }
  else if (a === "close"){ S.station = null; render(); }
  else if (a === "print") window.print();
});
$("app").addEventListener("change", e => { if (e.target.dataset.act === "before"){ S.showBefore = e.target.checked; render(); } });

async function load(i){
  S.demo = i; S.rec = null; S.phase = "loading"; render();
  try{
    const r = await fetch(DEMOS[i].file, {cache:"no-store"});
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const rec = await r.json();
    if (!Array.isArray(rec.options)) throw new Error("no options list");
    if (S.demo !== i) return;
    S.rec = rec; S.phase = "ok";
    const f = rec.options.length ? focusOption(rec) : null;
    S.sel = f ? f.id : null; S.station = f ? worstStation(f) : null;
  }catch(err){
    if (S.demo !== i) return;
    S.phase = "error"; S.err = `Couldn't read this file (${err.message}). It may be missing or not a valid design record.`;
  }
  render();
}
const sel = $("file");
sel.innerHTML = `<option value="">Select a demo file…</option>` + DEMOS.map((d,i)=>`<option value="${i}">${esc(d.label)}</option>`).join("");
sel.onchange = () => { if (sel.value === ""){ S.demo = ""; S.rec = null; S.phase = "idle"; render(); } else load(+sel.value); };

const m = location.hash.match(/design-([123])/);
if (m) S.design = +m[1];
if (location.protocol === "file:"){
  S.phase = "error"; S.err = "Browsers block reading files from a page opened by double-click. Run: python3 -m http.server, then open http://localhost:8000";
  render();
} else { sel.value = "0"; load(0); }
</script>
</body>
